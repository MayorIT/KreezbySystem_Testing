<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png?v=20261018tab">
    <link rel="icon" type="image/png" href="../assets/logo/favicon.png?v=20261018tab">
    <link rel="apple-touch-icon" href="../assets/logo/apple-touch-icon.png?v=20261018tab">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kreezby Bakeshop - Welcome</title>
    <link rel="preload" as="image" href="../assets/auth/kreezby-auth-flavors-bg.jpg?v=20261013shop">
    <style>html,body{background:#1a120c;}</style>
    <script>
        document.documentElement.dataset.authTab =
            /(?:\?|&)tab=signup(?:&|$)/.test(location.search) || location.hash === '#signup'
                ? 'signup' : 'login';
    </script>
    <link rel="stylesheet" href="../css/shared/auth-shell.css?v=20261023pills2">
    <link rel="stylesheet" href="../css/shared/kreezby-mobile.css?v=20261020icon2">
<script src="../js/kreezby-db-sync.js?v=20261023smooth1"></script>
<style>
/* Logo sits centered in the card above "Welcome" (no top bar). */
.auth-shell__center { padding-top: 2.5rem; }
@media (max-width: 900px) { .auth-shell__center { padding-top: 1rem; } .auth-card__logo img { height: 60px !important; } }
</style>
</head>
<body>

<section class="auth-shell" aria-label="Authentication">
    <div class="auth-shell__photo" aria-hidden="true"></div>
    <canvas class="auth-shell__particles" aria-hidden="true"></canvas>
    <div class="auth-shell__vignette" aria-hidden="true"></div>


    <div class="auth-shell__center">
        <div class="auth-card auth-card--wide card-animate" data-auth-tabs>
            <div class="auth-card__header">
                <a href="start.html" class="auth-card__logo" aria-label="Kreezby home" style="display:block;width:max-content;margin:0 auto 10px;">
                    <img src="../assets/logo/kreezby-logo.png" alt="Kreezby" style="display:block;height:76px;width:auto;max-width:72vw;">
                </a>
                <h1 class="auth-card__title">Welcome</h1>
                <p class="auth-card__description">Log in or create an account</p>
            </div>

            <div class="auth-card__content">
                <div class="auth-tabs" role="tablist" aria-label="Authentication mode">
                    <button type="button" class="auth-tab is-active" role="tab" data-auth-tab="login" aria-selected="true">
                        <span class="auth-tab__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
                        <span class="auth-tab__label">Log In</span>
                    </button>
                    <button type="button" class="auth-tab" role="tab" data-auth-tab="signup" aria-selected="false">
                        <span class="auth-tab__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 5-6 8-6s6.5 2 8 6"/></svg></span>
                        <span class="auth-tab__label">Sign Up</span>
                    </button>
                </div>

                <div class="auth-slide" data-auth-slide>
                <div class="auth-slide__track">
                <div class="auth-panel is-active" data-auth-panel="login" role="tabpanel">
                    <form class="login-form" novalidate onsubmit="return false;">
                        <div class="auth-field">
                            <label class="auth-label" for="identity">Email / Username</label>
                            <div class="auth-input-wrap">
                                <svg class="auth-input-icon" viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                                <input class="auth-input auth-input--icon-left" id="identity" type="text" name="identity" placeholder="you@example.com or username" autocomplete="username" required>
                            </div>
                        </div>

                        <div class="auth-field">
                            <label class="auth-label" for="password">Password</label>
                            <div class="auth-input-wrap">
                                <svg class="auth-input-icon" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                                <input class="auth-input auth-input--icon-left auth-input--icon-right" id="password" type="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
                                <button type="button" class="auth-toggle-password" data-auth-toggle-password aria-controls="password" aria-label="Show password">
                                    <svg viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                                </button>
                            </div>
                        </div>

                        <div class="auth-check-row">
                            <label class="auth-check">
                                <input type="checkbox" name="remember">
                                <span>Remember me</span>
                            </label>
                            <button type="button" class="auth-link auth-link-btn" data-auth-forgot aria-controls="auth-forgot-note" aria-expanded="false">Forgot password?</button>
                        </div>

                        <p class="auth-forgot-note" id="auth-forgot-note" hidden>
                            Password resets are handled by Admin or IT Kreezby. Report an issue after you log in.
                        </p>

                        <button type="submit" class="auth-btn">Continue</button>
                    </form>
                </div>

                <div class="auth-panel" data-auth-panel="signup" role="tabpanel">
                    <form class="signup-form" novalidate onsubmit="return false;">
                        <div class="auth-row">
                            <div class="auth-field">
                                <label class="auth-label" for="firstName">First name</label>
                                <input class="auth-input" id="firstName" type="text" name="firstName" placeholder="Maria" required>
                            </div>
                            <div class="auth-field">
                                <label class="auth-label" for="lastName">Last name</label>
                                <input class="auth-input" id="lastName" type="text" name="lastName" placeholder="Santos" required>
                            </div>
                        </div>

                        <div class="auth-field">
                            <label class="auth-label" for="signup-birthday">Birthday</label>
                            <input class="auth-input" id="signup-birthday" type="date" name="birthday">
                        </div>

                        <div class="auth-field">
                            <label class="auth-label" for="signup-username">Username</label>
                            <div class="auth-input-wrap">
                                <svg class="auth-input-icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>
                                <input class="auth-input auth-input--icon-left" id="signup-username" type="text" name="username" placeholder="maria_santos" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="30" required>
                            </div>
                            <p class="auth-field-note" style="color:rgba(255,255,255,.55);font-size:12px;margin:6px 0 0;">3–30 letters, numbers, dots or underscores. You can log in with this.</p>
                        </div>

                        <div class="auth-row">
                            <div class="auth-field">
                                <label class="auth-label" for="signup-email">Email</label>
                                <div class="auth-input-wrap">
                                    <svg class="auth-input-icon" viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                                    <input class="auth-input auth-input--icon-left" id="signup-email" type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
                                </div>
                            </div>
                            <div class="auth-field">
                                <label class="auth-label" for="signup-phone">Contact number</label>
                                <div class="auth-input-wrap">
                                    <svg class="auth-input-icon" viewBox="0 0 24 24"><rect width="12" height="20" x="6" y="2" rx="2"/><path d="M11 18h2"/></svg>
                                    <input class="auth-input auth-input--icon-left" id="signup-phone" type="tel" name="phone" placeholder="09XXXXXXXXX" autocomplete="tel" inputmode="tel" maxlength="16" required>
                                </div>
                            </div>
                        </div>

                        <div class="auth-field">
                            <label class="auth-label" for="signup-password">Password</label>
                            <div class="auth-input-wrap">
                                <svg class="auth-input-icon" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                                <input class="auth-input auth-input--icon-left auth-input--icon-right" id="signup-password" type="password" name="password" placeholder="••••••••" autocomplete="new-password" required>
                                <button type="button" class="auth-toggle-password" data-auth-toggle-password aria-controls="signup-password" aria-label="Show password">
                                    <svg viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                                </button>
                            </div>
                        </div>

                        <div class="auth-field">
                            <label class="auth-label" for="signup-confirm-password">Confirm password</label>
                            <div class="auth-input-wrap">
                                <svg class="auth-input-icon" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                                <input class="auth-input auth-input--icon-left auth-input--icon-right" id="signup-confirm-password" type="password" name="confirmPassword" placeholder="••••••••" autocomplete="new-password" required>
                                <button type="button" class="auth-toggle-password" data-auth-toggle-password aria-controls="signup-confirm-password" aria-label="Show password">
                                    <svg viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                                </button>
                            </div>
                            <p class="auth-field-note auth-field-note--error" id="signup-password-mismatch" hidden>Passwords don't match.</p>
                        </div>

                        <button type="submit" class="auth-btn">Create account</button>
                    </form>
                </div>
                </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script src="../js/kreezby-seed-portal-data.js?v=20261014rm"></script>
<script src="../js/auth-shell.js?v=20261023pills"></script>
<script src="../js/maintenance-settings.js?v=20261023mongo1"></script>
<script src="../js/app-runtime.js?v=20261024user"></script>
</body>
</html>
