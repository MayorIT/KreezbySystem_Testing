<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kreezby Bakeshop - Welcome</title>
    <link rel="stylesheet" href="../css/pages/start.css?v=20260925restore">
    <link rel="stylesheet" href="../css/shared/origin-button.css">
</head>
<body>

    <div class="splash-card">

        <div class="main-choice-container" id="mainChoiceScreen">
            <div class="brand-logo-large">Kreezby</div>
            <div class="screen-choice-prompt">How are you visiting us today?</div>
            <div class="button-group-main">
                <button type="button" class="origin-btn origin-btn--primary" onclick="showGuestOptions()">
                    Guest
                </button>
            </div>
        </div>

        <div class="guest-choice-container" id="guestChoiceScreen">
            <div class="guest-subtitle">Guest Access</div>
            <div class="guest-info-text">
                You can browse as a guest or create an account to unlock all features.
            </div>
            <div class="button-group-main button-group-origin">
                <a href="log_in.html" class="origin-btn origin-btn--secondary">Log In with Account</a>
                <a href="sign_up.html" class="origin-btn origin-btn--secondary">Create New Account</a>
                <a href="../customer/customer_guest.html" class="origin-btn origin-btn--secondary">Browse as Guest</a>
            </div>
            <div class="back-button-container">
                <button type="button" class="origin-btn origin-btn--ghost" onclick="backToMainChoice()">← Back</button>
            </div>
        </div>

    </div>

    <script>
        function showGuestOptions() {
            const mainChoice = document.getElementById('mainChoiceScreen');
            const guestChoice = document.getElementById('guestChoiceScreen');

            mainChoice.classList.add('hidden');
            guestChoice.classList.add('active');
        }

        function backToMainChoice() {
            const mainChoice = document.getElementById('mainChoiceScreen');
            const guestChoice = document.getElementById('guestChoiceScreen');

            mainChoice.classList.remove('hidden');
            guestChoice.classList.remove('active');
        }
    </script>
    <script src="../js/origin-button.js"></script>

</body>
</html>
