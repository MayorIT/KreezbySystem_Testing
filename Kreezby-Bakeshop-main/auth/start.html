<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png?v=20261018tab">
    <link rel="icon" type="image/png" href="../assets/logo/favicon.png?v=20261018tab">
    <link rel="apple-touch-icon" href="../assets/logo/apple-touch-icon.png?v=20261018tab">

<script src="../js/kreezby-db-sync.js?v=20261023smooth1"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kreezby Bakeshop - Welcome</title>
    <link rel="stylesheet" href="../css/pages/start.css?v=20261023fade">
    <link rel="prefetch" as="image" href="../assets/auth/kreezby-auth-flavors-bg.jpg?v=20261013shop">
    <link rel="prefetch" href="log_in.html">
    <link rel="prefetch" href="../css/shared/auth-shell.css?v=20261023fast">
    <link rel="stylesheet" href="../css/shared/origin-button.css">
    <link rel="stylesheet" href="../css/shared/kreezby-mobile.css?v=20261020icon2">
</head>
<body>

    <div class="splash-card">

        <div class="splash-slide" id="splashSlide">
        <div class="splash-slide__track">
        <div class="main-choice-container" id="mainChoiceScreen">
            <img class="brand-logo-large" src="../assets/logo/kreezby-logo.png" alt="Kreezby">
            <div class="screen-choice-prompt">How are you visiting us today?</div>
            <div class="button-group-main">
                <button type="button" class="origin-btn origin-btn--primary" onclick="showGuestOptions()">
                    Guest
                </button>
            </div>
        </div>

        <div class="guest-choice-container" id="guestChoiceScreen">
            <div class="guest-subtitle">Guest Access</div>
            <div class="guest-info-text">
                You can browse as a guest or create an account to unlock all features.
            </div>
            <div class="button-group-main button-group-origin">
                <a href="log_in.html" class="origin-btn origin-btn--secondary">Log In with Account</a>
                <a href="log_in.html?tab=signup" class="origin-btn origin-btn--secondary">Create New Account</a>
                <a href="../customer/customer_guest.html" class="origin-btn origin-btn--secondary">Browse as Guest</a>
            </div>
            <div class="back-button-container">
                <button type="button" class="origin-btn origin-btn--ghost" onclick="backToMainChoice()">← Back</button>
            </div>
        </div>
        </div>
        </div>

    </div>

    <script>
        // The card's height comes from CSS (both panels share one grid cell), so there is
        // nothing to measure. This only pauses clicks/hover briefly while the panels fade.
        function sizeSplash() {
            const slide = document.getElementById('splashSlide');
            slide.style.height = '';
            slide.classList.add('is-switching');
            clearTimeout(sizeSplash.timer);
            sizeSplash.timer = setTimeout(function () { slide.classList.remove('is-switching'); }, 320);
        }

        function showGuestOptions() {
            const mainChoice = document.getElementById('mainChoiceScreen');
            const guestChoice = document.getElementById('guestChoiceScreen');
            const slide = document.getElementById('splashSlide');

            slide.classList.add('is-guest');
            mainChoice.classList.add('hidden');
            guestChoice.classList.add('active');
            sizeSplash();
        }

        function backToMainChoice() {
            const mainChoice = document.getElementById('mainChoiceScreen');
            const guestChoice = document.getElementById('guestChoiceScreen');
            const slide = document.getElementById('splashSlide');

            slide.classList.remove('is-guest');
            mainChoice.classList.remove('hidden');
            guestChoice.classList.remove('active');
            sizeSplash();
        }

        window.addEventListener('load', sizeSplash);
        window.addEventListener('resize', sizeSplash);
    </script>
    <script src="../js/origin-button.js"></script>

</body>
</html>
