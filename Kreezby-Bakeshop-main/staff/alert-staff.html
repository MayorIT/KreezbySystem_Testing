<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png?v=20261018tab">
    <link rel="icon" type="image/png" href="../assets/logo/favicon.png?v=20261018tab">
    <link rel="apple-touch-icon" href="../assets/logo/apple-touch-icon.png?v=20261018tab">

<script src="../js/kreezby-db-sync.js?v=20261027stock1"></script>
    <meta charset="UTF-8">
        <meta name="view-transition" content="same-origin">
    <link rel="stylesheet" href="../css/shared/kreezby-turbo-nav.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kreezby Bakeshop - System Alerts (Staff)</title>
    <link rel="stylesheet" href="../css/pages/staff/alert-staff.css">
    <link rel="stylesheet" href="../css/shared/kreezby-alert.css">

    <link rel="stylesheet" href="../css/shared/expandable-nav-tabs.css">
    <link rel="stylesheet" href="../css/shared/portal-shell-layout.css?v=20261010palette">
    <link rel="stylesheet" href="../css/shared/admin-icon-sidebar.css?v=20260927active">
    <link rel="stylesheet" href="../css/shared/order-tabbed-layout.css">
    <link rel="stylesheet" id="po-theme-sheet" href="../css/pages/admin/po-theme.css?v=20261010palette">
</head>
<body class="po-admin-page">
<script>try{if(localStorage.getItem('kreezbySidebarCollapsed')==='1')document.body.classList.add('sidebar-collapsed');}catch(e){}</script>



    <header class="top-navbar-node">
        <div class="brand-logo-panel"><img src="../assets/logo/kreezby-logo.png" alt="Kreezby logo"></div>
        <div class="top-nav-links-right">
            <button type="button" class="notification-pill" aria-label="Notifications"></button>
            <div class="user-dropdown">
                <button type="button" class="user-dropdown-pill" id="user-dropdown-trigger">
                    Staff ▾
                </button>
                <div class="user-dropdown-menu" id="user-dropdown-menu">
                    <a href="report_issue-staff.html" class="dropdown-item">Report Issue</a>
                    <a href="../auth/log_in.html" class="dropdown-item">↩ Log Out</a>
                </div>
            </div>
        </div>
    </header>

    <div class="core-viewport-wrapper">

        <aside class="dark-sidebar-panel" aria-label="Staff navigation"></aside>

        <turbo-frame id="kreezby-main-content" class="kreezby-turbo-main">
        <main class="workspace-view-canvas">

            <div id="alert-master" class="panel-data-card po-tabbed-card">
                <div id="alert-list-panel">
                    <div class="kreezby-alert-stack" id="admin-alert-banners"></div>

                    <div class="po-list-toolbar">
                        <div class="po-list-toolbar-title">
                            <h3>System Stock Alerts</h3>
                            <span class="po-list-count" id="alert-count"></span>
                        </div>
                        <div class="po-list-toolbar-tools">
                            <label class="po-page-size">Show
                                <select id="alert-show">
                                    <option value="10" selected>10</option>
                                    <option value="25">25</option>
                                </select>
                            </label>
                            <div class="search-field-wrap">
                                <input type="text" id="alert-search" placeholder="Filter by message or item...">
                            </div>
                        </div>
                    </div>

                    <div class="card-body-padded po-list-body">
                        <div class="po-table-scroll-wrap">
                            <table class="data-display-table" id="alert-table">
                                <colgroup>
                                    <col class="al-col-num">
                                    <col class="al-col-time">
                                    <col class="al-col-source">
                                    <col class="al-col-message">
                                    <col class="al-col-severity">
                                    <col class="al-col-action">
                                </colgroup>
                                <thead>
                                    <tr>
                                        <th class="al-col-num">#</th>
                                        <th class="al-col-time">Timestamp</th>
                                        <th class="al-col-source">Trigger Source</th>
                                        <th class="al-col-message">Alert Message</th>
                                        <th class="al-col-severity">Severity</th>
                                        <th class="al-col-action">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr class="kreezby-phone-span"><td colspan="6" style="text-align:center;padding:18px;color:#7a6558;">Loading alerts…</td></tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="datatable-footer-line" id="alert-footer">
                            <span>System stock alerts</span>
                            <span id="alert-totals"></span>
                        </div>
                    </div>
                </div>

                <div id="alert-details-panel" hidden>
                    <div class="po-list-toolbar">
                        <div class="po-list-toolbar-title">
                            <h3>Alert Details</h3>
                        </div>
                        <div class="po-list-toolbar-tools">
                            <button type="button" id="alert-back">Back to list</button>
                        </div>
                    </div>
                    <div id="alert-details-body"></div>
                </div>
            </div>

        </main>
        <script>
        (function () {
            function applyAlertTheme() {
                if (!document.getElementById('alert-master')) return;
                document.body.classList.add('po-admin-page');
                var theme = document.getElementById('po-theme-sheet');
                if (!theme) {
                    theme = document.createElement('link');
                    theme.id = 'po-theme-sheet';
                    theme.rel = 'stylesheet';
                    theme.setAttribute('data-po-owned', '1');
                    document.head.appendChild(theme);
                }
                theme.disabled = false;
                if (theme.href.indexOf('20261008layalert') < 0) theme.href = '../css/pages/admin/po-theme.css?v=20261010palette';
                if (window.AlertAdmin && window.AlertAdmin.bind) {
                    try { window.AlertAdmin.bind(); } catch (e) {}
                    return;
                }
                if (document.getElementById('kreezby-alert-frame-script')) return;
                var script = document.createElement('script');
                script.id = 'kreezby-alert-frame-script';
                script.src = '../js/alert-admin.js?v=20261014noalertbar';
                script.onload = function () {
                    if (window.AlertAdmin && window.AlertAdmin.bind) window.AlertAdmin.bind();
                };
                document.body.appendChild(script);
            }
            applyAlertTheme();
            document.addEventListener('turbo:frame-load', applyAlertTheme);
            document.addEventListener('kreezby:page-load', applyAlertTheme);
        })();
        </script>
        </turbo-frame>
    </div>

    <script src="../js/kreezby-alert.js"></script>
    <script src="../js/alert-admin.js?v=20261014noalertbar"></script>
    <script src="../js/staff-permissions.js?v=20261022menu4"></script>
        <script src="../js/user-dropdown-nav.js?v=20261022menu5"></script>
        <script src="../js/staff-sidebar.js?v=20261022menu4"></script>
<script src="../js/sidebar-toggle.js?v=20261010dash"></script>
</body>
</html>
