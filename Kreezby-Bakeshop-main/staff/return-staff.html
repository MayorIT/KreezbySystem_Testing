<!DOCTYPE html>
<html lang="en">
<head>
<script src="../js/kreezby-db-sync.js"></script>
    <meta charset="UTF-8">
        <meta name="view-transition" content="same-origin">
    <link rel="stylesheet" href="../css/shared/kreezby-turbo-nav.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kreezby Bakeshop - Return / P.O List (Admin)</title>
    <link rel="stylesheet" href="../css/pages/staff/return-staff.css">
    <link rel="stylesheet" href="../css/shared/order-tabbed-layout.css">

    <link rel="stylesheet" href="../css/shared/expandable-nav-tabs.css">
    <link rel="stylesheet" href="../css/shared/portal-shell-layout.css">
    <link rel="stylesheet" href="../css/shared/admin-icon-sidebar.css?v=20260927active">
</head>
<body>
<script>try{if(localStorage.getItem('kreezbySidebarCollapsed')==='1')document.body.classList.add('sidebar-collapsed');}catch(e){}</script>



    <header class="top-navbar-node">
        <div class="brand-logo-panel"><img src="../assets/logo/kreezby-logo.png" alt="Kreezby logo"></div>
        <div class="top-nav-links-right">
            <a class="top-nav-item home-badge" href="staff-1.html">Home</a>
            <button type="button" class="notification-pill" aria-label="Notifications"></button>
            <div class="user-dropdown">
                <button type="button" class="user-dropdown-pill" id="user-dropdown-trigger">
                    Staff ▾
                </button>
                <div class="user-dropdown-menu" id="user-dropdown-menu">
                    <a href="report_issue-staff.html" class="dropdown-item">Report Issue</a>
                    <a href="../auth/log_in.html" class="dropdown-item">↩ Log Out</a>
                </div>
            </div>
        </div>
    </header>

    <div class="core-viewport-wrapper">

        <aside class="dark-sidebar-panel" aria-label="Staff navigation"></aside>

        <turbo-frame id="kreezby-main-content" class="kreezby-turbo-main">
        <main class="workspace-view-canvas">

            <div id="returns-master-list-panel-view">
                <div class="panel-data-card po-tabbed-card">
                    <div class="po-order-tabs" role="tablist" data-panel-prefix="return">
                        <button type="button" class="po-order-tab active" data-tab="retailer" role="tab" aria-selected="true">Retailer Returns</button>
                        <button type="button" class="po-order-tab" data-tab="customer" role="tab" aria-selected="false">Customer Returns</button>
                    </div>

                    <div id="return-tab-retailer" class="po-tab-panel active" role="tabpanel">
                        <div class="panel-card-title-bar">
                            <h3>Retailer Returns</h3>
                        </div>
                        <div class="card-body-padded">
                            <div class="datatable-filters-line">
                                <div>Show <select><option value="10">10</option><option value="25">25</option></select> entries</div>
                                <div class="search-field-wrap">
                                    <input type="text" id="return-retailer-search" placeholder="Return code, PO code, entity, status...">
                                </div>
                            </div>
                            <div class="po-table-scroll-wrap">
                                <table class="data-display-table">
                                    <thead>
                                        <tr>
                                            <th>#</th>
                                            <th>Date Created</th>
                                            <th>Return Code</th>
                                            <th>P.O. Code Origin</th>
                                            <th>Retailer / Entity</th>
                                            <th>Items Count</th>
                                            <th>Status</th>
                                            <th>Action</th>
                                        </tr>
                                    </thead>
                                    <tbody id="return-retailer-tbody"></tbody>
                                </table>
                            </div>
                            <div class="datatable-footer-line" id="return-retailer-footer"></div>
                        </div>
                    </div>

                    <div id="return-tab-customer" class="po-tab-panel" role="tabpanel">
                        <div class="panel-card-title-bar">
                            <h3>Customer Returns</h3>
                        </div>
                        <div class="card-body-padded">
                            <div class="datatable-filters-line">
                                <div>Show <select><option value="10">10</option><option value="25">25</option></select> entries</div>
                                <div class="search-field-wrap">
                                    <input type="text" id="return-customer-search" placeholder="Return code, PO code, customer, status...">
                                </div>
                            </div>
                            <div class="po-table-scroll-wrap">
                                <table class="data-display-table">
                                    <thead>
                                        <tr>
                                            <th>#</th>
                                            <th>Date Created</th>
                                            <th>Return Code</th>
                                            <th>P.O. Code Origin</th>
                                            <th>Customer</th>
                                            <th>Items Count</th>
                                            <th>Status</th>
                                            <th>Action</th>
                                        </tr>
                                    </thead>
                                    <tbody id="return-customer-tbody"></tbody>
                                </table>
                            </div>
                            <div class="datatable-footer-line" id="return-customer-footer"></div>
                        </div>
                    </div>
                </div>
            </div>


            <div id="returns-details-inspector-panel-view" style="display: none;">
                <div class="panel-data-card">
                    <div class="panel-card-title-bar">
                        <h3 id="return-details-title">Return Details</h3>
                    </div>
                    <div class="card-body-padded">
                        <div id="return-details-content"></div>
                        <div class="details-action-footer-row">
                            <button class="btn-viewer-tool green" id="return-details-print-btn" type="button">Print Return Slip</button>
                            <button class="btn-viewer-tool blue" id="return-details-edit-btn" type="button">Edit Record</button>
                            <button class="btn-viewer-tool black" id="return-details-back-btn" type="button">Back To Master Index</button>
                        </div>
                    </div>
                </div>
            </div>

        </main>
        </turbo-frame>
    </div>

    <script src="../js/tab-panel-transition.js"></script>
    <script src="../js/order-tabbed-layout.js"></script>
    <script src="../js/return-admin.js"></script>
    <script src="../js/staff-permissions.js?v=20260929title"></script>
        <script src="../js/user-dropdown-nav.js?v=20260929title"></script>
        <script src="../js/staff-sidebar.js?v=20260929title"></script>
<script src="../js/sidebar-toggle.js?v=20260927row"></script>
</body>
</html>
