<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png?v=20261018tab">
    <link rel="icon" type="image/png" href="../assets/logo/favicon.png?v=20261018tab">
    <link rel="apple-touch-icon" href="../assets/logo/apple-touch-icon.png?v=20261018tab">

<script src="../js/kreezby-db-sync.js?v=20261027stock1"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <link rel="stylesheet" href="../css/shared/kreezby-turbo-nav.css">
    <title>Kreezby Bakeshop - Point of Sale (Admin)</title>
    <link rel="stylesheet" href="../css/pages/admin/po-theme.css?v=20261014iconfix">
    <link rel="stylesheet" id="kreezby-pos-style" href="../css/pages/admin/pos-admin.css?v=20261028posv7">
</head>
<body class="po-admin-page" data-kreezby-portal="admin-pos">

    <header class="top-navbar-node">
        <div class="brand-logo-panel"><img src="../assets/logo/kreezby-logo.png" alt="Kreezby logo"></div>
        <div class="top-nav-links-right">
            <div class="user-dropdown">
                <button type="button" class="user-dropdown-pill" id="user-dropdown-trigger">
                    <span style="background:#fff; width:18px; height:18px; border-radius:50%; display:inline-block;"></span>
                    Admin ▾
                </button>
                <div class="user-dropdown-menu" id="user-dropdown-menu">
                    <a href="../auth/log_in.html" class="dropdown-item">↩ Log Out</a>
                </div>
            </div>
        </div>
    </header>

    <div class="core-viewport-wrapper">
        <aside class="dark-sidebar-panel" aria-label="Admin navigation"></aside>

        <turbo-frame id="kreezby-main-content" class="kreezby-turbo-main">
        <main class="workspace-view-canvas">
            <div id="pos-master" class="panel-data-card po-tabbed-card"></div>
        </main>
        <script>
        (function () {
            function bootPos() {
                if (document.readyState === 'loading') return; // pos.js below boots itself
                if (!document.getElementById('pos-master')) return;
                document.body.classList.add('po-admin-page');
                if (window.KreezbyPos && window.KreezbyPos.boot) {
                    window.KreezbyPos.boot();
                    return;
                }
                if (document.getElementById('kreezby-pos-script')) return;
                var dict = document.createElement('script');
                dict.src = '../js/kreezby-data-dictionary.js?v=20261027stock1';
                dict.onload = function () {
                    var script = document.createElement('script');
                    script.id = 'kreezby-pos-script';
                    script.src = '../js/pos.js?v=20261028mv3';
                    document.body.appendChild(script);
                };
                document.body.appendChild(dict);
            }
            function bootDelivery() {
                if (!document.getElementById('pos-master')) return;
                if (window.KreezbyDeliveryPos) { window.KreezbyDeliveryPos.boot(); return; }
                if (document.getElementById('kreezby-delivery-pos-script')) return;
                var d = document.createElement('script');
                d.id = 'kreezby-delivery-pos-script';
                d.src = '../js/delivery-pos.js?v=20261025area';
                document.body.appendChild(d);
            }
            bootPos();
            bootDelivery();
            document.addEventListener('turbo:frame-load', bootDelivery);
            document.addEventListener('kreezby:page-load', bootDelivery);
            document.addEventListener('turbo:frame-load', bootPos);
            document.addEventListener('kreezby:page-load', bootPos);
        })();
        </script>
        </turbo-frame>
    </div>
    <script src="../js/kreezby-data-dictionary.js?v=20261027stock1"></script>
    <script src="../js/pos.js?v=20261028mv3"></script>
    <script src="../js/user-dropdown-nav.js?v=20261022menu5"></script>
    <script src="../js/admin-sidebar.js?v=20261022menu4"></script>
    <script src="../js/sidebar-toggle.js?v=20260927row"></script>
</body>
</html>
