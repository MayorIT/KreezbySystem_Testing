        <script>
        (function () {
            function switchCustomerTab(name) {
                var root = document.getElementById('bo-master-dashboard-split-view');
                if (!root || !name) return;
                var tablist = root.querySelector('.bo-order-tabs');
                if (window.KreezbyTabPanels && tablist) {
                    window.KreezbyTabPanels.switch({
                        tablist: tablist,
                        tabName: name,
                        prefix: 'bo',
                        tabBtnSelector: '.bo-order-tab',
                        panelSelector: '.bo-tab-panel'
                    });
                    return;
                }
                root.querySelectorAll('.bo-order-tab').forEach(function (btn) {
                    var on = btn.getAttribute('data-tab') === name;
                    btn.classList.toggle('active', on);
                    btn.setAttribute('aria-selected', on ? 'true' : 'false');
                });
                root.querySelectorAll('.bo-tab-panel').forEach(function (panel) {
                    panel.classList.toggle('active', panel.id === 'bo-tab-' + name);
                });
            }
            if (!window.__kreezbyBoTabClick) {
                window.__kreezbyBoTabClick = function (ev) {
                    var root = document.getElementById('bo-master-dashboard-split-view');
                    if (!root || !ev.target || !ev.target.closest) return;
                    var btn = ev.target.closest('.bo-order-tab');
                    if (!btn || !root.contains(btn)) return;
                    switchCustomerTab(btn.getAttribute('data-tab'));
                };
                document.addEventListener('click', window.__kreezbyBoTabClick, true);
            }
            if (window.BoAdmin && window.BoAdmin.bind) {
                try { window.BoAdmin.bind(); } catch (e) {}
            }
        })();
        </script>
