<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline · Kreezby Bakeshop</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #fffaf3; color: #3e2723; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
        main { max-width: 420px; padding: 32px 24px; text-align: center; }
        img { width: 96px; height: 96px; border-radius: 20px; }
        h1 { font-size: 22px; margin: 18px 0 8px; }
        p { margin: 0 0 18px; color: #6d4c41; }
        button { border: 0; border-radius: 999px; padding: 12px 22px; background: #5d4037; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <img src="assets/logo/icon-192.png" alt="Kreezby Bakeshop">
        <h1>You are offline</h1>
        <p>Kreezby Bakeshop needs an internet connection to load stock, orders and sales, so that every account sees the same up-to-date records. Connect to the internet and try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
