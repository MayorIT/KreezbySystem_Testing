<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png?v=20261018tab">
    <link rel="icon" type="image/png" href="../assets/logo/favicon.png?v=20261018tab">
    <link rel="apple-touch-icon" href="../assets/logo/apple-touch-icon.png?v=20261018tab">

<script src="../js/kreezby-db-sync.js?v=20261022menu4"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <link rel="stylesheet" href="../css/shared/kreezby-turbo-nav.css">
    <title>Kreezby Bakeshop - Stock Level (Head Admin)</title>
    <link rel="stylesheet" href="../css/pages/admin/stocklevel-admin.css?v=20261015value">
    <link rel="stylesheet" href="../css/shared/expandable-nav-tabs.css">
    <link rel="stylesheet" href="../css/shared/order-tabbed-layout.css">
    <link rel="stylesheet" id="po-theme-sheet" href="../css/pages/admin/po-theme.css?v=20261015view">
</head>
<body class="po-admin-page" data-kreezby-portal="admin-stocklevel">

    <header class="top-navbar-node">
        <div class="brand-logo-panel"><img src="../assets/logo/kreezby-logo.png" alt="Kreezby logo"></div>
        <div class="top-nav-links-right">
            <div class="user-dropdown">
                <button type="button" class="user-dropdown-pill" id="user-dropdown-trigger">
                    <span style="background:#fff; width:18px; height:18px; border-radius:50%; display:inline-block;"></span>
                    Admin ▾
                </button>
                <div class="user-dropdown-menu" id="user-dropdown-menu">
                    <a href="../auth/log_in.html" class="dropdown-item">↩ Log Out</a>
                </div>
            </div>
        </div>
    </header>

    <div class="core-viewport-wrapper">
        <aside class="dark-sidebar-panel" aria-label="Head Admin navigation"></aside>

        <turbo-frame id="kreezby-main-content" class="kreezby-turbo-main">
        <main class="workspace-view-canvas">
            <div id="stocklevel-master" class="panel-data-card po-tabbed-card">
                <div class="po-order-tabs ai-filter-pills" id="stocklevel-filter-pills" role="tablist"></div>
                <div class="po-list-toolbar">
                    <div class="po-list-toolbar-title">
                        <h3 id="stocklevel-title">Total Value of Stock</h3>
                        <span class="po-list-count" id="stocklevel-count"></span>
                    </div>
                    <div class="po-list-toolbar-tools">
                        <div class="search-field-wrap">
                            <input type="text" id="stocklevel-search" placeholder="Filter item or category...">
                        </div>
                    </div>
                </div>
                <div class="card-body-padded po-list-body" id="stocklevel-scroll">
                    <div id="stocklevel-dashboard-root" data-view="value" data-report-href="stocks-headadmin.html"></div>
                </div>
            </div>
        </main>
        <script>
        (function () {
            function applyStockTheme() {
                if (!document.getElementById('stocklevel-master')) return;
                document.body.classList.add('po-admin-page');
                var theme = document.getElementById('po-theme-sheet');
                if (!theme) {
                    theme = document.createElement('link');
                    theme.id = 'po-theme-sheet';
                    theme.rel = 'stylesheet';
                    theme.setAttribute('data-po-owned', '1');
                    document.head.appendChild(theme);
                }
                theme.disabled = false;
                if (theme.href.indexOf('20261014iconfix') < 0) theme.href = '../css/pages/admin/po-theme.css?v=20261015view';
                function boot() {
                    if (window.KreezbyStockLevelPills && window.KreezbyStockLevelPills.boot) {
                        try { window.KreezbyStockLevelPills.boot(); } catch (e) {}
                    }
                    if (window.KreezbyStockLevelDashboard && window.KreezbyStockLevelDashboard.boot && !window.KreezbyStockLevelPills) {
                        try { window.KreezbyStockLevelDashboard.boot(); } catch (e2) {}
                    }
                }
                if (window.KreezbyStockLevelPills && window.KreezbyStockLevelPills.show && window.KreezbyStockLevelDashboard && window.KreezbyStockLevelDashboard.turboLinks) {
                    boot();
                    return;
                }
                if (document.getElementById('kreezby-stocklevel-frame-script')) {
                    boot();
                    return;
                }
                var dash = document.createElement('script');
                dash.id = 'kreezby-stocklevel-frame-script';
                dash.src = '../js/stocklevel-dashboard.js?v=20261022mv2';
                dash.onload = function () {
                    var pills = document.createElement('script');
                    pills.src = '../js/stocklevel-pills.js?v=20261014iconfix';
                    pills.onload = boot;
                    document.body.appendChild(pills);
                };
                document.body.appendChild(dash);
            }
            applyStockTheme();
            document.addEventListener('turbo:frame-load', applyStockTheme);
            document.addEventListener('kreezby:page-load', applyStockTheme);
        })();
        </script>
        </turbo-frame>
    </div>
    <script src="../js/stocklevel-dashboard.js?v=20261022mv2"></script>
    <script src="../js/stocklevel-pills.js?v=20261014iconfix"></script>
    <script src="../js/user-dropdown-nav.js?v=20261022home"></script>
    <script src="../js/admin-sidebar.js?v=20261022menu4"></script>
    <script src="../js/sidebar-toggle.js?v=20260927row"></script>
</body>
</html>
