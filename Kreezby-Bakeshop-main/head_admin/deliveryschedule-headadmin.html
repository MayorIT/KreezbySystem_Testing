<!DOCTYPE html>
<html lang="en">
<head>
<script src="../js/kreezby-db-sync.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <link rel="stylesheet" href="../css/shared/kreezby-turbo-nav.css">
    <title>Kreezby Bakeshop - Delivery Schedule (Head Admin)</title>
    <link rel="stylesheet" href="../css/pages/admin/aiforecast_deliveryoverview-admin.css">
    <link rel="stylesheet" href="../css/shared/expandable-nav-tabs.css">
    <link rel="stylesheet" href="../css/shared/order-tabbed-layout.css">
    <link rel="stylesheet" id="po-theme-sheet" href="../css/pages/admin/po-theme.css?v=20261008del">

</head>
<body class="po-admin-page" data-kreezby-portal="admin-delivery">

    <header class="top-navbar-node">
        <div class="brand-logo-panel"><img src="../assets/logo/kreezby-logo.png" alt="Kreezby logo"></div>
        <div class="top-nav-links-right">
            <a class="top-nav-item home-badge" href="head_admin.html">Home</a>
            <div class="user-dropdown">
                <button type="button" class="user-dropdown-pill" id="user-dropdown-trigger">
                    <span style="background:#fff; width:18px; height:18px; border-radius:50%; display:inline-block;"></span>
                    Admin ▾
                </button>
                <div class="user-dropdown-menu" id="user-dropdown-menu">
                    <a href="../auth/log_in.html" class="dropdown-item">↩ Log Out</a>
                </div>
            </div>
        </div>
    </header>

    <div class="core-viewport-wrapper">
        <aside class="dark-sidebar-panel" aria-label="Head Admin navigation"></aside>

        <turbo-frame id="kreezby-main-content" class="kreezby-turbo-main">
        <main class="workspace-view-canvas">

            <div id="delivery-schedule-master" class="panel-data-card po-tabbed-card">
                <div class="po-list-toolbar">
                    <div class="po-list-toolbar-title">
                        <h3>Delivery Schedule</h3>
                        <span class="po-list-count" id="delivery-schedule-count"></span>
                    </div>
                </div>
                <div class="card-body-padded po-list-body">
                    <div id="delivery-schedule"></div>
                    <div class="datatable-footer-line" id="delivery-schedule-footer">
                        <span id="delivery-schedule-summary">Upcoming stops</span>
                    </div>
                </div>
            </div>

        </main>
        <script>
        (function () {
            function applyDeliveryTheme() {
                if (!document.getElementById('delivery-schedule-master')) return;
                document.body.classList.add('po-admin-page');
                var theme = document.getElementById('po-theme-sheet');
                if (!theme) {
                    theme = document.createElement('link');
                    theme.id = 'po-theme-sheet';
                    theme.rel = 'stylesheet';
                    theme.setAttribute('data-po-owned', '1');
                    document.head.appendChild(theme);
                }
                theme.disabled = false;
                if (theme.href.indexOf('20261008del') < 0) theme.href = '../css/pages/admin/po-theme.css?v=20261008del';
                if (window.KreezbyDeliverySchedule && window.KreezbyDeliverySchedule.boot) {
                    try { window.KreezbyDeliverySchedule.boot(); } catch (e) {}
                }
            }
            applyDeliveryTheme();
            document.addEventListener('turbo:frame-load', applyDeliveryTheme);
            document.addEventListener('kreezby:page-load', applyDeliveryTheme);
        })();
        </script>
        </turbo-frame>
    </div>

    <script src="../js/user-dropdown-nav.js?v=20261008del"></script>
    <script src="../js/admin-sidebar.js?v=20261008del"></script>
    <script src="../js/sidebar-toggle.js?v=20260927row"></script>
    <script src="../js/retailer-manifest-loader.js"></script>
    <script src="../js/delivery-schedule.js?v=20261008del"></script>
</body>
</html>
