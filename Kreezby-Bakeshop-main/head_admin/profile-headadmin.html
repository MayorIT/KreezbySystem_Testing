<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png?v=20261018tab">
    <link rel="icon" type="image/png" href="../assets/logo/favicon.png?v=20261018tab">
    <link rel="apple-touch-icon" href="../assets/logo/apple-touch-icon.png?v=20261018tab">

<script src="../js/kreezby-db-sync.js?v=20261020live"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <link rel="stylesheet" href="../css/shared/kreezby-turbo-nav.css">
    <title>Kreezby Bakeshop - Profile (Head Admin)</title>
    <link rel="stylesheet" href="../css/pages/admin/alert-admin.css">
    <link rel="stylesheet" href="../css/shared/portal-profile.css?v=20261015layout6">
    <link rel="stylesheet" href="../css/shared/admin-icon-sidebar.css?v=20260927active">
</head>
<body>
    <header class="top-navbar-node">
        <div class="brand-logo-panel"><img src="../assets/logo/kreezby-logo.png" alt="Kreezby logo"></div>
        <div class="top-nav-links-right">
            <a class="top-nav-item home-badge" href="head_admin.html">Home</a>
            <div class="user-dropdown">
                <button type="button" class="user-dropdown-pill" id="user-dropdown-trigger" aria-haspopup="true" aria-expanded="false">Head Admin ▾</button>
                <div class="user-dropdown-menu" id="user-dropdown-menu">
                    <a href="profile-headadmin.html" class="dropdown-item" data-profile-link="1">Profile</a>
                    <a href="../auth/log_in.html" class="dropdown-item">↩ Log Out</a>
                </div>
            </div>
        </div>
    </header>
    <div class="core-viewport-wrapper">
        <aside class="dark-sidebar-panel" aria-label="Head Admin navigation"></aside>
        <turbo-frame id="kreezby-main-content" class="kreezby-turbo-main">
        <main class="workspace-view-canvas">
            <div class="portal-profile" id="portal-profile">
                <section class="portal-profile__hero portal-profile__hero--photo">
                    <div class="portal-profile__avatar" id="profile-avatar-preview" aria-hidden="true">H</div>
                    <button type="button" class="secondary portal-profile__photo-btn" id="profile-photo-btn">Change photo</button>
                    <input type="file" id="profile-avatar-input" accept="image/*" hidden>
                    <div class="portal-profile__hero-copy">
                        <p class="portal-profile__kicker">Account</p>
                        <h2 class="portal-profile__name" id="profile-display-name">Account</h2>
                        <p class="portal-profile__meta">
                            <span class="portal-profile__chip" id="profile-role-chip" hidden></span>
                            <span class="portal-profile__handle" id="profile-handle" hidden></span>
                        </p>
                        <p class="portal-profile__lead">Your photo is the detail you can change here. Name and contact stay with the account record.</p>
                        <p id="profile-account-note" class="portal-profile__note" hidden></p>
                    </div>
                    <div class="portal-profile__hero-actions">
                        <button type="button" id="profile-save">Save photo</button>
                        <p class="portal-profile__status" id="profile-status" role="status"></p>
                    </div>
                </section>
            </div>
        </main>
        </turbo-frame>
    </div>
    <script src="../js/maintenance-settings.js?v=20261018accounts"></script>
    <script src="../js/browser-alerts.js?v=20261020auto"></script>
    <script src="../js/portal-profile.js?v=20261015layout6"></script>
    <script src="../js/user-dropdown-nav.js?v=20261013profile"></script>
    <script src="../js/admin-sidebar.js?v=20261020share"></script>
    <script src="../js/sidebar-toggle.js?v=20261010dash"></script>
    <script>
        document.getElementById('profile-photo-btn').addEventListener('click', function () {
            document.getElementById('profile-avatar-input').click();
        });
    </script>
</body>
</html>
