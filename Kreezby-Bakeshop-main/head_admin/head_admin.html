<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <link rel="stylesheet" href="../css/shared/kreezby-turbo-nav.css">
    <title>Kreezby Bakeshop - Head Admin Dashboard</title>
    <link rel="stylesheet" href="../css/pages/admin/admin.css">
    <link rel="stylesheet" href="../css/shared/admin-icon-sidebar.css?v=20260927active">
    <link rel="stylesheet" href="../css/shared/expandable-nav-tabs.css">

    <link rel="stylesheet" href="../css/shared/kreezby-welcome-home.css">
</head>
<body class="kreezby-admin-home">
<script>try{if(localStorage.getItem('kreezbySidebarCollapsed')==='1')document.body.classList.add('sidebar-collapsed');}catch(e){}</script>

    <header class="top-navbar-node">
        <div class="brand-logo-panel"><img src="../assets/logo/kreezby-logo.png" alt="Kreezby logo"></div>
        <div class="top-nav-links-right">
            <a class="top-nav-item home-badge" href="head_admin.html">Home</a>
            <button type="button" class="notification-pill" aria-label="Notifications">🔔</button>
            <div class="user-dropdown">
                <button type="button" class="user-dropdown-pill" id="user-dropdown-trigger">
                    <span style="background:#fff; width:18px; height:18px; border-radius:50%; display:inline-block;"></span>
                    Head Admin ▾
                </button>
                <div class="user-dropdown-menu" id="user-dropdown-menu">
                                        <a href="../auth/log_in.html" class="dropdown-item">↩ Log Out</a>
                </div>
            </div>
        </div>
    </header>
 
    <div class="core-viewport-wrapper">

        <aside class="dark-sidebar-panel" aria-label="Head Admin navigation"></aside>

        <turbo-frame id="kreezby-main-content" class="kreezby-turbo-main">
        <main class="workspace-view-canvas">

            <div id="admin-dashboard-root">
                <section class="admin-home" aria-label="Welcome">
                    <div class="admin-home-stage">
                        <div class="admin-home-copy">
                            <p class="admin-home-kicker">The Crinkle Factory</p>
                            <h2>Welcome, Head Admin</h2>
                            <p class="admin-home-tagline">Making your life sweeter!</p>
                            <p class="admin-home-lead">Your home is ready. Purchase orders, deliveries, sales, stock, and alerts open from the menu.</p>
                            <button type="button" class="admin-home-menu-btn" id="admin-open-menu" aria-expanded="false">
                                <span class="admin-home-menu-btn__icon" aria-hidden="true">☰</span>
                                <span class="admin-home-menu-btn__label">Open menu</span>
                            </button>
                        </div>
                        <figure class="admin-home-photo">
                            <img src="../assets/home/kreezby-welcome.png" alt="Kreezby chocolate crinkles, choco oatmeal cookies, and assorted crinkles">
                        </figure>
                    </div>
                </section>
            </div>

        </main>
        </turbo-frame>
    </div>

    <div class="notification-modal-overlay" id="notification-modal-overlay" hidden aria-hidden="true"></div>

    <script src="../js/kreezby-seed-portal-data.js?v=20260929webpay"></script>
    <script src="../js/kreezby-partner-inquiries.js"></script>
    <script src="../js/order-tracking.js"></script>
    <script src="../js/user-dropdown-nav.js?v=20260929title"></script>
    <script src="../js/admin-permissions.js"></script>
    <script src="../js/admin-sidebar.js?v=20260929title"></script>
    <script src="../js/sidebar-toggle.js?v=20260927row"></script>
    <script>
        (function () {
            var el = document.querySelector('[data-inquiry-count]');
            if (!el || !window.KreezbyPartnerInquiries) return;
            try {
                el.textContent = String((window.KreezbyPartnerInquiries.list() || []).length);
            } catch (e) { /* ignore */ }
        })();
    </script>
</body>
</html>
