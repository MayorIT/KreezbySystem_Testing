<!DOCTYPE html>
<html lang="en">
<head>
<script src="../js/kreezby-db-sync.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/shared/kreezby-turbo-nav.css?v=20261010max">
    <style id="admin-no-motion">
        @view-transition { navigation: none; }
        body.kreezby-admin-home,
        body.kreezby-admin-home *,
        body.kreezby-admin-home *::before,
        body.kreezby-admin-home *::after {
            animation: none !important;
            animation-delay: 0s !important;
            animation-duration: 0s !important;
            transition: none !important;
            transition-delay: 0s !important;
            transition-duration: 0s !important;
            scroll-behavior: auto !important;
            will-change: auto !important;
        }
        body.kreezby-admin-home turbo-frame#kreezby-main-content,
        body.kreezby-admin-home #kreezby-main-content,
        body.kreezby-admin-home turbo-frame#kreezby-main-content.is-kreezby-leaving,
        body.kreezby-admin-home #kreezby-main-content.is-kreezby-leaving,
        body.kreezby-admin-home aside.dark-sidebar-panel {
            opacity: 1 !important;
            view-transition-name: none !important;
        }
        body.kreezby-admin-home button:active,
        body.kreezby-admin-home [role="button"]:active,
        body.kreezby-admin-home .admin-home-menu-btn:hover,
        body.kreezby-admin-home .admin-home-menu-btn:active,
        body.kreezby-admin-home .kreezby-sidebar-nav-item:active {
            transform: none !important;
        }
    </style>
    <script>
        (function () {
            function onHome() {
                var file = (location.pathname.split('/').pop() || '').toLowerCase().split('?')[0];
                return file === 'head_admin.html' || file === '';
            }
            function stripViewTransition() {
                if (!onHome()) return;
                document.querySelectorAll('meta[name="view-transition"]').forEach(function (el) { el.remove(); });
            }
            stripViewTransition();
            if (window.MutationObserver && document.documentElement) {
                new MutationObserver(stripViewTransition).observe(document.documentElement, { childList: true, subtree: true });
            }
        })();
    </script>
    <title>Kreezby Bakeshop - Head Admin Dashboard</title>
    <link rel="stylesheet" href="../css/pages/admin/admin.css">
    <link rel="stylesheet" href="../css/shared/admin-icon-sidebar.css?v=20260927active">
    <link rel="stylesheet" href="../css/shared/expandable-nav-tabs.css">

    <link rel="stylesheet" href="../css/shared/kreezby-welcome-home.css?v=20261010max">
</head>
<body class="kreezby-admin-home">

    <script src="../js/admin-permissions.js?v=20261006perm"></script>
    <script src="../js/admin-sidebar.js?v=20261007proc"></script>
    <script src="../js/sidebar-toggle.js?v=20261005home"></script>
    <script>
        (function () {
            function isDashboard() {
                var file = (location.pathname.split('/').pop() || '').toLowerCase().split('?')[0];
                return file === 'head_admin.html' || file === '';
            }
            function keepNumberedBell(header) {
                if (!header || !header.querySelector('.notification-popover-root')) return;
                header.querySelectorAll('.notification-pill').forEach(function (el) { el.remove(); });
            }
            function stripHeaderChrome() {
                var dashboard = isDashboard();
                document.body.classList.toggle('kreezby-admin-home', dashboard);
                if (!dashboard) return;
                var header = document.querySelector('.top-navbar-node');
                if (!header) return;
                header.querySelectorAll('.hamburger-toggle, a.home-badge, a.expandable-nav-tab, .expandable-nav-tabs').forEach(function (el) {
                    if (el.closest('.user-dropdown')) return;
                    el.remove();
                });
                keepNumberedBell(header);
            }
            function syncMenuButton() {
                var btn = document.getElementById('admin-open-menu');
                if (!btn) return;
                var open = document.body.classList.contains('kreezby-nav-open');
                btn.setAttribute('aria-expanded', open ? 'true' : 'false');
                var label = btn.querySelector('.admin-home-menu-btn__label');
                if (label) label.textContent = open ? 'Close menu' : 'Open menu';
            }
            stripHeaderChrome();
            document.addEventListener('kreezby:page-load', function () {
                stripHeaderChrome();
                syncMenuButton();
            });
            document.addEventListener('kreezby-admin-sidebar-ready', stripHeaderChrome);
            var header = document.querySelector('.top-navbar-node');
            if (header && window.MutationObserver) {
                new MutationObserver(function (records) {
                    if (!document.body.classList.contains('kreezby-admin-home')) return;
                    var dirty = false;
                    records.forEach(function (record) {
                        record.addedNodes.forEach(function (node) {
                            if (!node || node.nodeType !== 1) return;
                            if (node.matches('.hamburger-toggle, a.home-badge, a.expandable-nav-tab, .expandable-nav-tabs, .notification-pill') ||
                                (node.querySelector && node.querySelector('.hamburger-toggle, a.home-badge, a.expandable-nav-tab, .notification-pill, .notification-popover-root'))) {
                                dirty = true;
                            }
                        });
                    });
                    if (dirty) stripHeaderChrome();
                }).observe(header, { childList: true, subtree: true });
            }
            document.addEventListener('click', function (event) {
                if (!event.target.closest('aside.dark-sidebar-panel a')) return;
                document.body.classList.remove('kreezby-nav-open');
                syncMenuButton();
            });
            document.addEventListener('keydown', function (event) {
                if (event.key !== 'Escape' || !document.body.classList.contains('kreezby-nav-open')) return;
                document.body.classList.remove('kreezby-nav-open');
                syncMenuButton();
            });
        })();
    </script>
    <script>
        (function () {
            var el = document.querySelector('[data-inquiry-count]');
            if (!el || !window.KreezbyPartnerInquiries) return;
            try {
                el.textContent = String((window.KreezbyPartnerInquiries.list() || []).length);
            } catch (e) { /* ignore */ }
        })();
    </script>
