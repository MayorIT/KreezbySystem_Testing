    <style id="admin-no-motion">
        @view-transition { navigation: none; }
        body.kreezby-admin-home,
        body.kreezby-admin-home *,
        body.kreezby-admin-home *::before,
        body.kreezby-admin-home *::after {
            animation: none !important;
            animation-delay: 0s !important;
            animation-duration: 0s !important;
            transition: none !important;
            transition-delay: 0s !important;
            transition-duration: 0s !important;
            scroll-behavior: auto !important;
            will-change: auto !important;
        }
        body.kreezby-admin-home turbo-frame#kreezby-main-content,
        body.kreezby-admin-home #kreezby-main-content,
        body.kreezby-admin-home turbo-frame#kreezby-main-content.is-kreezby-leaving,
        body.kreezby-admin-home #kreezby-main-content.is-kreezby-leaving,
        body.kreezby-admin-home aside.sidebar-panel,
        body.kreezby-admin-home aside.dark-sidebar-panel {
            opacity: 1 !important;
            view-transition-name: none !important;
        }
        body.kreezby-admin-home button:active,
        body.kreezby-admin-home [role="button"]:active,
        body.kreezby-admin-home .admin-home-menu-btn:hover,
        body.kreezby-admin-home .admin-home-menu-btn:active,
        body.kreezby-admin-home .kreezby-sidebar-nav-item:active {
            transform: none !important;
        }
    </style>
    <script>
        (function () {
            function onHome() {
                var file = (location.pathname.split('/').pop() || '').toLowerCase().split('?')[0];
                return file === 'retailer-portal.html' || file === '';
            }
            function stripViewTransition() {
                if (!onHome()) return;
                document.querySelectorAll('meta[name="view-transition"]').forEach(function (el) { el.remove(); });
            }
            stripViewTransition();
            if (window.MutationObserver && document.documentElement) {
                new MutationObserver(stripViewTransition).observe(document.documentElement, { childList: true, subtree: true });
            }
        })();
    </script>
