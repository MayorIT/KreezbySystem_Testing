<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kreezby Bakeshop - Customer Help Center</title>
    <link rel="stylesheet" href="../css/shared/inbox-chat-layout.css">
    <link rel="stylesheet" href="../css/pages/customer/inbox-customer.css?v=20260928help4">
    <link rel="stylesheet" href="../css/shared/kreezby-mobile.css?v=20260925phone9">
    <link rel="stylesheet" href="../css/shared/customer-phone-shop.css?v=20260925phone4">
    <link rel="stylesheet" href="../css/shared/customer-site-header.css?v=20260928hdr2">
</head>
<body>

    <header class="site-header">
        <a class="logo-area" href="customer.html">
            <span class="logo-title">Kreezby</span>
            <span class="logo-tagline">The Crinkle Factory</span>
        </a>
        <nav class="nav-actions" aria-label="Customer account">
            <a class="nav-btn notifications-trigger-btn" data-nav="favorites" href="customer.html?open=favorites">
                <span class="nav-btn__icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M12 21s-6.7-4.35-9.33-8.2C.7 9.9 1.53 5.68 5.53 4.6c2.23-.6 4.27.23 5.47 1.93 1.2-1.7 3.24-2.53 5.47-1.93 4 1.08 4.83 5.3 2.86 8.2C18.7 16.65 12 21 12 21z"/></svg>
                </span>
                <span class="nav-btn__label">Favorites</span>
                <span class="notifications-trigger-badge" id="favorites-trigger-badge" hidden>0</span>
            </a>
            <a class="nav-btn orders-trigger-btn" data-nav="orders" href="customer.html?open=orders" aria-label="Order Notification">
                <span class="nav-btn__icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M12 22a2.2 2.2 0 0 0 2.2-2.2H9.8A2.2 2.2 0 0 0 12 22zm7-5.5V11a7 7 0 1 0-14 0v5.5L3 18v1h18v-1l-2-1.5z"/></svg>
                </span>
                <span class="nav-btn__label">Order Notification</span>
                <span class="notifications-trigger-badge" id="orders-trigger-badge" hidden>0</span>
            </a>
            <a class="nav-btn profile-trigger-btn" data-nav="profile" href="customer.html?open=profile">
                <span class="nav-btn__icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M12 12a4.2 4.2 0 1 0-4.2-4.2A4.2 4.2 0 0 0 12 12zm0 2.2c-3.5 0-8.2 1.7-8.2 5.1V21h16.4v-1.7c0-3.4-4.7-5.1-8.2-5.1z"/></svg>
                </span>
                <span class="nav-btn__label">My Profile</span>
            </a>
            <a class="nav-btn cart-toggle-btn" data-nav="cart" href="customer.html?open=cart" aria-label="Cart">
                <span class="nav-btn__icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M7 7V6a5 5 0 0 1 10 0v1h3l-1.5 13H5.5L4 7h3zm2 0h6V6a3 3 0 0 0-6 0v1z"/></svg>
                </span>
                <span class="nav-btn__label">Cart</span>
                <span class="notifications-trigger-badge" id="global-cart-count" hidden>0</span>
            </a>
            <div class="user-dropdown-wrapper">
                <button class="nav-btn" type="button" id="user-dropdown-trigger" data-nav="customer">
                    <span class="nav-btn__icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 5a3 3 0 1 1-3 3 3 3 0 0 1 3-3zm0 12.2a7.2 7.2 0 0 1-5.4-2.4 5.5 5.5 0 0 1 10.8 0A7.2 7.2 0 0 1 12 19.2z"/></svg>
                    </span>
                    <span class="nav-btn__label">Customer</span>
                    <span class="nav-btn__caret" aria-hidden="true">▾</span>
                </button>
                <div class="user-dropdown-menu" id="user-dropdown-menu">
                    <a href="inbox-customer.html" class="dropdown-item">Help Center</a>
                    <a href="report_issue-customer.html" class="dropdown-item">Report Issue</a>
                    <a href="../auth/log_in.html" class="dropdown-item">↩ Log Out</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="customer-inbox-main customer-inbox-main--assistant">
        <section class="help-bot" id="help-bot" aria-label="Kreezby shopping assistant">
            <header class="help-bot__bar">
                <div class="help-bot__avatar" aria-hidden="true">K</div>
                <div class="help-bot__id">
                    <h1>Kreezby Assistant</h1>
                    <p><span class="help-bot__dot" aria-hidden="true"></span> Online</p>
                </div>
            </header>
            <div class="help-bot__thread" id="help-bot-thread" role="log" aria-live="polite" aria-relevant="additions"></div>
            <div class="help-bot__quick" id="help-bot-quick" aria-label="Suggested questions"></div>
            <form class="help-bot__composer" id="help-bot-form">
                <input id="help-bot-input" type="text" maxlength="240" autocomplete="off" placeholder="Ask about crinkles, delivery, or your order" aria-label="Message the Kreezby assistant">
                <button type="submit" class="help-bot__send">Send</button>
            </form>
        </section>
    </main>

    <script src="../js/customer-orders.js?v=20260929proc"></script>
    <script src="../js/customer-site-header.js?v=20260928hdr"></script>
    <script src="../js/kreezby-seed-portal-data.js?v=20260929trade"></script>
    <script src="../js/customer-help-chat.js?v=20260929nomint"></script>
    <script src="../js/user-dropdown-nav.js?v=20260927req"></script>
    <script src="../js/customer-phone-shop.js?v=20260925phone4"></script>
</body>
</html>
