<!DOCTYPE html>
<html lang="en">
<head>
<script src="../js/kreezby-db-sync.js"></script>
    <meta charset="UTF-8">
        <meta name="view-transition" content="same-origin">
    <link rel="stylesheet" href="../css/shared/kreezby-turbo-nav.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kreezby Bakeshop - Inventory Report (Staff)</title>
    <link rel="stylesheet" href="../css/pages/staff/inventoryreport-staff.css?v=20261011invrep">

    <link rel="stylesheet" href="../css/shared/expandable-nav-tabs.css">
    <link rel="stylesheet" href="../css/shared/portal-shell-layout.css?v=20261010palette">
    <link rel="stylesheet" href="../css/shared/admin-icon-sidebar.css?v=20260927active">
</head>
<body>
<script>try{if(localStorage.getItem('kreezbySidebarCollapsed')==='1')document.body.classList.add('sidebar-collapsed');}catch(e){}</script>



    <header class="top-navbar-node">
        <div class="brand-logo-panel"><img src="../assets/logo/kreezby-logo.png" alt="Kreezby logo"></div>
        <div class="top-nav-links-right">
            <a class="top-nav-item home-badge" href="staff.html">Home</a>
            <button type="button" class="notification-pill" aria-label="Notifications"></button>
            <div class="user-dropdown">
                <button type="button" class="user-dropdown-pill" id="user-dropdown-trigger">
                    Staff ?
                </button>
                <div class="user-dropdown-menu" id="user-dropdown-menu">
                    <a href="report_issue-staff.html" class="dropdown-item">Report Issue</a>
                    <a href="../auth/log_in.html" class="dropdown-item">? Log Out</a>
                </div>
            </div>
        </div>
    </header>

    <div class="core-viewport-wrapper">

        <aside class="dark-sidebar-panel" aria-label="Staff navigation"></aside>

        <turbo-frame id="kreezby-main-content" class="kreezby-turbo-main">
        <main class="workspace-view-canvas">
            
            <div class="inventory-entry">
            <div class="report-panel-header-banner">
                <span class="inventory-kicker">Staff inventory</span>
                <h1>Inventory Report</h1>
                <p>Count what is on hand, then save the stock value for the day.</p>
            </div>

            <div class="report-form-card">
                <form action="#" method="POST" id="inventory-report-form-root">
                    
                    <div class="form-section-title">Report settings</div>
                    
                    <div class="report-settings-grid">
                        <div class="form-field-block">
                            <label>Report Date</label>
                            <input type="date" value="2026-05-16">
                        </div>
                        <div class="form-field-block">
                            <label>Category</label>
                            <select id="category-filter-select">
                                <option value="All Categories" selected>All categories</option>
                                <option value="Pouches Only">Finished pouches</option>
                                <option value="Jars Only">Finished jars</option>
                                <option value="Raw Materials">Raw materials</option>
                            </select>
                        </div>
                        <div class="form-field-block">
                            <label>Status</label>
                            <select id="status-filter-select">
                                <option value="Active" selected>Active stock</option>
                                <option value="Archived">Archived</option>
                                <option value="All">All records</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-section-title">Add an item</div>

                    <div class="item-builder-dashed-bar">
                        <div class="form-field-block">
                            <label>Product</label>
                            <select id="builder-flavor-sku">
                                <option value="">Select a product</option>
                                <option value="Chocolate Crinkles (Pouch)" data-cost="120.00">CRK-CHO-P — Chocolate Crinkles (₱120.00)</option>
                                <option value="Choco-Almond Crinkles (Pouch)" data-cost="125.00">CRK-ALM-P — Choco-Almond Crinkles (₱125.00)</option>
                                <option value="Lemon Crinkles (Pouch)" data-cost="120.00">CRK-LEM-P — Lemon Crinkles (₱120.00)</option>
                                <option value="Choco Butternut Crinkles (Jar)" data-cost="150.00">CRK-BUT-J — Choco Butternut (₱150.00)</option>
                                <option value="Mango Crinkles (Jar)" data-cost="150.00">CRK-MNG-J — Mango Crinkles (₱150.00)</option>
                            </select>
                        </div>
                        <div class="form-field-block">
                            <label>In stock qty</label>
                            <input type="number" id="builder-qty-stock" min="0" placeholder="e.g. 100">
                        </div>
                        <button type="button" class="btn-inline-add" onclick="appendProductRowToReportLedgerMatrix()">+ Add Item</button>
                    </div>

                    <table class="data-display-table inventory-ledger" id="report-ledger-table-root">
                        <thead>
                            <tr>
                                <th class="inv-col-num">#</th>
                                <th>Item</th>
                                <th class="inv-col-qty">In stock qty</th>
                                <th class="inv-col-money">Cost per unit</th>
                                <th class="inv-col-money">Value</th>
                                <th class="inv-col-action">Action</th>
                            </tr>
                        </thead>
                        <tbody id="report-rows-injector-target">
                            <tr>
                                <td>1</td>
                                <td><input type="text" class="matrix-input-field" value="Chocolate Crinkles (Pouch)" readonly></td>
                                <td><input type="number" class="matrix-input-field inv-qty" value="250" oninput="recalculateRowReportValue(this, 120.00)"></td>
                                <td><input type="text" class="matrix-input-field inv-money" value="120.00" readonly></td>
                                <td><input type="text" class="matrix-input-field inv-money row-value-calc-field" value="30000.00" readonly></td>
                                <td class="inv-action"><button type="button" class="btn-row-action" onclick="removeReportLineRow(this)">Delete</button></td>
                            </tr>
                            <tr>
                                <td>2</td>
                                <td><input type="text" class="matrix-input-field" value="Choco Butternut Crinkles (Jar)" readonly></td>
                                <td><input type="number" class="matrix-input-field inv-qty" value="75" oninput="recalculateRowReportValue(this, 150.00)"></td>
                                <td><input type="text" class="matrix-input-field inv-money" value="150.00" readonly></td>
                                <td><input type="text" class="matrix-input-field inv-money row-value-calc-field" value="11250.00" readonly></td>
                                <td class="inv-action"><button type="button" class="btn-row-action" onclick="removeReportLineRow(this)">Delete</button></td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr class="inventory-total-row">
                                <td colspan="4">Total stock value</td>
                                <td id="report-grand-total-label">₱41,250.00</td>
                                <td></td>
                            </tr>
                        </tfoot>
                    </table>

                    <div class="report-actions-footer">
                        <button type="button" class="btn-save-report" onclick="submitInventoryReportLogsDocument()">Save Report</button>
                        <button type="button" class="btn-cancel-report" onclick="resetReportWorkspaceCanvas()">Cancel</button>
                    </div>

                </form>
            </div>
            </div>

        </main>
        </turbo-frame>
    </div>

    <script>
        function recalculateRowReportValue(qtyInputNode, itemRateCost) {
            const currentQty = parseInt(qtyInputNode.value) || 0;
            const contextTrRow = qtyInputNode.closest('tr');
            const targetValueField = contextTrRow.querySelector('.row-value-calc-field');

            const computedRowValue = currentQty * itemRateCost;
            targetValueField.value = computedRowValue.toFixed(2);

            updateReportGrandTotalAssetSummary();
        }

        function updateReportGrandTotalAssetSummary() {
            const allValueFields = document.querySelectorAll('.row-value-calc-field');
            let totalAccumulatedAssets = 0;

            allValueFields.forEach(field => {
                totalAccumulatedAssets += parseFloat(field.value) || 0;
            });

            document.getElementById('report-grand-total-label').textContent = '₱' + totalAccumulatedAssets.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function appendProductRowToReportLedgerMatrix() {
            const flavorSkuSelector = document.getElementById('builder-flavor-sku');
            const targetSelectedOption = flavorSkuSelector.options[flavorSkuSelector.selectedIndex];
            const chosenFlavorLabel = flavorSkuSelector.value;
            const stockQtyInputVal = parseInt(document.getElementById('builder-qty-stock').value) || 0;

            if (!chosenFlavorLabel || stockQtyInputVal < 0) {
                alert('Please pick a valid inventory product target line and define an explicit stock unit quantity field.');
                return;
            }

            const parsedUnitCostVal = parseFloat(targetSelectedOption.getAttribute('data-cost')) || 0;
            const calculatedTotalRowValue = parsedUnitCostVal * stockQtyInputVal;
            const reportTableBodyTarget = document.getElementById('report-rows-injector-target');
            const nextCalculatedRowIndex = reportTableBodyTarget.children.length + 1;

            const newTrElementNode = document.createElement('tr');
            newTrElementNode.innerHTML = `
                <td>${nextCalculatedRowIndex}</td>
                <td><input type="text" class="matrix-input-field" value="${chosenFlavorLabel}" readonly></td>
                <td><input type="number" class="matrix-input-field inv-qty" value="${stockQtyInputVal}" oninput="recalculateRowReportValue(this, ${parsedUnitCostVal})"></td>
                <td><input type="text" class="matrix-input-field inv-money" value="${parsedUnitCostVal.toFixed(2)}" readonly></td>
                <td><input type="text" class="matrix-input-field inv-money row-value-calc-field" value="${calculatedTotalRowValue.toFixed(2)}" readonly></td>
                <td class="inv-action"><button type="button" class="btn-row-action" onclick="removeReportLineRow(this)">Delete</button></td>
            `;

            reportTableBodyTarget.appendChild(newTrElementNode);
            if (window.KreezbyActions) KreezbyActions.init();

            // Flush inputs variables storage values buffers for next data sequence injection loops comfort
            document.getElementById('builder-qty-stock').value = '';
            flavorSkuSelector.value = '';

            updateReportGrandTotalAssetSummary();
        }

        function removeReportLineRow(deleteButtonNode) {
            const selectedTrRow = deleteButtonNode.closest('tr');
            selectedTrRow.remove();

            // Dynamic normalization row count line updates sequence indices numbers recalculator
            const activeTrRows = document.querySelectorAll('#report-rows-injector-target tr');
            activeTrRows.forEach((row, standardLoopIndex) => {
                row.children[0].textContent = standardLoopIndex + 1;
            });

            updateReportGrandTotalAssetSummary();
        }

        function submitInventoryReportLogsDocument() {
            const itemsMatrixLinesCount = document.getElementById('report-rows-injector-target').children.length;
            if (itemsMatrixLinesCount === 0) {
                alert('Verification blocked. Cannot create empty audit sheet statement logs. Please include at least one inventory entry check line.');
                return;
            }
            alert('Inventory statement documentation successfully compiled, certified, and saved to file databases pipelines arrays!');
            resetReportWorkspaceCanvas();
        }

        function resetReportWorkspaceCanvas() {
            document.getElementById('inventory-report-form-root').reset();
            document.getElementById('report-rows-injector-target').innerHTML = '';
            updateReportGrandTotalAssetSummary();
        }
    </script>
    <script src="../js/staff-permissions.js?v=20261011invrep"></script>
        <script src="../js/user-dropdown-nav.js?v=20261011staffbtns"></script>
        <script src="../js/staff-sidebar.js?v=20261010norecv"></script>
<script src="../js/sidebar-toggle.js?v=20261010dash"></script>
</body>
</html>
